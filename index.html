<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>柳树沟村 · 数字村落 V1.1</title>
<link rel="stylesheet" href="./css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<!-- 同机位对比：A 帧缓存（2D canvas）+ 分割线。两者都不接指针事件，只在 body.comparing 时显形。
     A 是抓下来的一帧位图，所以切 A/B 不触发任何渲染，也就不会有相机阻尼。 -->
<div id="abLayer"><canvas id="abCanvas"></canvas></div>
<div id="abDivider"></div>

<div id="hud">
  <header id="topbar">
    <div class="brand">
      <h1 id="villageName">—</h1>
      <p id="villageSub">—</p>
    </div>
    <div id="stats"></div>
    <div class="meta">
      <span id="seasonTag">—</span>
      <span id="fps" class="mono">— FPS</span>
    </div>
  </header>

  <div id="timebar">
    <button id="playBtn" class="ghost-btn">暂停</button>
    <div class="tb-track">
      <input id="timeRange" type="range" min="0" max="35040" value="0" step="1" />
      <div class="tb-marks"><i>1月</i><i>4月</i><i>7月</i><i>10月</i><i>12月</i></div>
    </div>
    <div class="tb-read">
      <b id="timeDate">2025-01-01</b>
      <span id="timeWx">—</span>
    </div>
    <div id="wxPreset" title="跳到岷县 2025 实测数据里真实的晴 / 阴 / 雨 / 雪时刻">
      <em>天气</em>
      <button data-wx="sunny">晴</button>
      <button data-wx="overcast">阴</button>
      <button data-wx="rain">雨</button>
      <button data-wx="snow">雪</button>
    </div>
    <div id="speedCtl" title="时间流速：一天相当于现实中的时长">
      <em>一天</em>
      <button data-speed="0">6分</button>
      <button data-speed="1" class="on">3分</button>
      <button data-speed="2">1分</button>
      <button data-speed="3">20秒</button>
    </div>
  </div>

  <div id="hint">—</div>

  <div id="qualityBar" title="画质档位：像素比 / 环境光遮蔽 / 泛光 / 阴影精度">
    <em>画质</em>
    <button data-q="low">流畅</button>
    <button data-q="mid">均衡</button>
    <button data-q="high">精致</button>
  </div>

  <div id="modebar">
    <button class="mode-btn on" data-mode="orbit">上帝视角</button>
    <button class="mode-btn" data-mode="walk">第一人称</button>
    <button id="btnReset" class="ghost-btn">复位</button>
    <button id="tourBtn" class="ghost-btn" title="自动巡游约 30 秒；Esc 或点任意处中断">巡游</button>
    <button id="abBtn" class="ghost-btn" title="同机位 A/B 对比：把当前画面记为 A，再改时间看 B">对比</button>
    <button id="labelBtn" class="ghost-btn" title="教学标注层：地名 / 地块编号 / 等高线（2 m 间隔）">标注</button>
    <button id="sectionBtn" class="ghost-btn" title="河谷剖面：沿 z=−60 切线剖开地形，露出河床下切 2.2 m / 水位 −0.6 m / 水面宽 8 m；不与第一人称、巡游同时启用">剖面</button>
    <button id="wxChartBtn" class="ghost-btn" title="岷县 2025 全年气温与降水；点 / 拖曲线跳到对应时刻">气象</button>
  </div>

  <div id="abPanel">
    <div class="ab-head">
      <span>A</span>
      <input id="abSlider" type="range" min="0" max="100" value="50" step="1"
             title="拖动改变分割位置；按住 Tab 全屏看 A" />
      <span>B</span>
    </div>
    <div class="ab-foot">
      <em id="abInfo">左 A（已缓存） · 右 B（实时）</em>
      <button id="abRecapture" class="ghost-btn">重记 A</button>
      <button id="abClose" class="ghost-btn">退出</button>
    </div>
  </div>

  <div id="joystick">
    <div class="joy-base"></div>
    <div id="joy-knob"></div>
  </div>

  <div id="wxPanel">
    <div class="wxp-head">
      <em>岷县 2025 · 全年气温与降水</em>
      <button id="wxPanelClose" class="ghost-btn">收起</button>
    </div>
    <canvas id="wxCanvas" title="点 / 拖曲线跳到对应时刻（15 分钟一格）"></canvas>
    <p class="wxp-foot">逐小时实测 8760 条 · 折线 = 日均温（℃）· 柱 = 日降水（mm）· 点 / 拖跳时刻</p>
  </div>

  <div id="crosshair"></div>
</div>

<div id="tourLayer">
  <div id="tourCaption"></div>
</div>

<aside id="card"></aside>

<div id="loader">
  <div class="loader-inner">
    <div class="ring"></div>
    <p id="loaderText">正在载入…</p>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
